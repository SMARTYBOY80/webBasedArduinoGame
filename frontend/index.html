<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="assets/css/global.css" />
		<title>Flappy Bird Clone</title>
	</head>
	<body>
		<div id="game">
			<div id="header">
				<span class="title"> Flappy Bird (Arduino Game)</span>
				<span class="author">Made by Jack Smart & Jamie MacDonald</span>
			</div>

			<div id="window">
				<section id="startScreen">
					<button class="play">Play</button>
					<button class="guide">Guide</button>
					<button class="leaderboard">Leaderboard</button>
				</section>
				<section id="guide">
					<p>example text</p>
					<button class="back">back</button>
				</section>
				<section id="leaderboard">
					<ol id="leaderboardText">Leaderboard
						
					</ol>
					<button class="back">back</button>
				</section>
			</div>

			<div id="guide window">

			</div>

			<p id="scoreDisplay">Score: 0</p>
			<canvas id="gameCanvas" width="900" height="600"></canvas>
		</div>

		<script src="assets/js/flappyBird.js"></script>
		<script src="assets/js/startMenu.js"></script>
	</body>
</html>
